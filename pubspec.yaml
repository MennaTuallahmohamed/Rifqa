name: rafeek

description: رفيق المعتمر - Flutter implementation
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  share_plus: ^10.0.2
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.5.2
  url_launcher: ^6.3.2
  flutter_map: ^7.0.1
  latlong2: ^0.9.1
  maplibre_gl: ^0.27.1
  geolocator: ^14.0.2
  flutter_compass: ^0.8.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  adhan_dart: ^2.0.1
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  record: ^6.0.0
  path_provider: ^2.1.5
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.0.0
  speech_to_text: ^7.5.0
  firebase_ai: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
